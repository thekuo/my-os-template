name = "my-os"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "<YOUR_CLOUDFLARE_ACCOUNT_ID>"

routes = [
  { pattern = "my-os.example.com", custom_domain = true },
  # v1 UI during the overlap; same Worker and D1
  { pattern = "v1.my-os.example.com", custom_domain = true },
]

[triggers]
crons = ["17 11 * * *", "*/10 * * * *", "5-55/10 * * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "my-os"
database_id = "<YOUR_D1_DATABASE_ID>"

# Exposes the deployed version id (cron_tick events, /api/agent/version)
# Chat media (src/media.js): private R2 bucket (never public, no r2.dev URL), images kept 7 days for the CoS to look at.
[[r2_buckets]]
binding = "ITEM_MEDIA"
bucket_name = "my-os-media"

[version_metadata]
binding = "CF_VERSION_METADATA"

# Workers Logs: keeps console output and invocation records (incl. cron runs) in the dashboard
[observability]
enabled = true
